name: 每日新闻邮件

on:
  schedule:
    # 每天北京时间 20:00（UTC 12:00）
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: write  # 允许自动提交去重缓存

jobs:
  send-news:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: pip install requests feedparser

      - name: 发送新闻邮件
        env:
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          SMTP_SENDER: ${{ secrets.SMTP_SENDER }}
          SMTP_RECEIVER: ${{ secrets.SMTP_RECEIVER }}
        run: python news_daily.py

      - name: 提交去重缓存
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sent_news.json
          if git diff --cached --quiet; then
            echo "无变更，跳过提交"
          else
            git commit -m "chore: 更新新闻去重缓存 [skip ci]"
            git push
          fi
