name: 每日新闻邮件

# 2026-11-18 起停掉定时发信：新闻已并入「日课」插件（每日 20 条，国内 10 + 国际 10）。
# 保留手动触发，想单独跑一次邮件时仍可在 Actions 页面点 Run workflow。
on:
  workflow_dispatch:

permissions:
  contents: write  # 允许自动提交去重缓存

jobs:
  send-news:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: pip install requests feedparser

      - name: 发送新闻邮件
        env:
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          SMTP_SENDER: ${{ secrets.SMTP_SENDER }}
          SMTP_RECEIVER: ${{ secrets.SMTP_RECEIVER }}
        run: python news_daily.py

      - name: 提交去重缓存
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sent_news.json
          if git diff --cached --quiet; then
            echo "无变更，跳过提交"
          else
            git commit -m "chore: 更新新闻去重缓存 [skip ci]"
            git push
          fi
